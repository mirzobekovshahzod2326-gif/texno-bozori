<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ТЕХНО БОЗОРИ">
<title>ТЕХНО БОЗОРИ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:dark;--bg:#05070D;--s:#0B1226;--l:#1B2748;--n:#0F1E4A;--sky:#3FA9F5;--ink:#EAF1FF;--m:#8FA0C8}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
input,select,textarea{width:100%;background:var(--s);border:1.5px solid var(--l);border-radius:10px;padding:10px}textarea{min-height:100px}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--l);padding:calc(8px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.02em}.brand img{width:30px;height:30px;border-radius:8px}.brand i{font-style:normal;color:var(--sky)}
header select{width:auto;margin-left:auto;padding:6px}
main{max-width:1000px;margin:0 auto;padding:14px}
.btn{border:0;border-radius:10px;background:var(--sky);color:#04101F;padding:10px 16px;font-weight:700;display:inline-block;text-align:center}.btn.g{background:var(--n);color:var(--ink)}.btn.r{background:#7A1F2B;color:#fff}.btn.sm{padding:6px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row>*{flex:1;min-width:120px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0}.chip{flex:none;border:1.5px solid var(--l);background:var(--s);border-radius:999px;padding:6px 12px;white-space:nowrap}.chip.on{background:var(--n);border-color:var(--sky)}
.catgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:8px 0 14px}.catitem{min-height:54px;text-align:left;border:1px solid var(--l);border-radius:12px;background:var(--s);padding:10px;display:flex;align-items:center;gap:9px}.catitem.on{border-color:var(--sky);background:var(--n)}.catitem .ico{font-size:22px}.catitem .ctxt{font-size:13px;font-weight:650;line-height:1.25}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.card{background:var(--s);border:1px solid var(--l);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:4/3;background:var(--n);display:grid;place-items:center;font-size:32px}.ph img{width:100%;height:100%;object-fit:cover}
.in{padding:10px;display:flex;flex-direction:column;gap:2px}.in b{color:var(--sky)}.in span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}small{color:var(--m)}
.box{background:var(--s);border:1px solid var(--l);border-radius:14px;padding:14px;margin:10px 0}.box label{display:block;margin:10px 0 4px;color:var(--m);font-size:13px}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory}.gal img{height:260px;border-radius:12px;scroll-snap-align:start;max-width:92%}
.empty{text-align:center;color:var(--m);padding:40px 0}h1{font-size:20px;margin:6px 0}h2{font-size:17px;margin:12px 0 6px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--s);border-top:1px solid var(--l);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav a{flex:1;text-align:center;padding:9px 0;font-size:12px;color:var(--m)}nav a.on{color:var(--sky)}nav a span{display:block;font-size:20px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs div{position:relative}.thumbs img{width:70px;height:70px;object-fit:cover;border-radius:8px}.thumbs button{position:absolute;top:-6px;right:-6px;border-radius:50%;width:22px;height:22px;border:0;background:#7A1F2B;color:#fff}
.li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--l)}.li>a{flex:1;overflow:hidden}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--sky);color:#04101F;padding:9px 16px;border-radius:999px;display:none;z-index:9;font-weight:700}
</style>
</head>
<body>
<header><a class="brand" href="#/"><img src="icon.svg" alt=""><span>ТЕХНО <i>БОЗОРИ</i></span></a>
<select id="lg" aria-label="Til"><option value="uz">O‘zbekcha</option><option value="tg">Тоҷикӣ</option><option value="ru">Русский</option></select></header>

<script src="config.js"></script>

<script>
"use strict";
const sb=supabase.createClient(CFG.url,CFG.key);
const CATS=[["phones","📱","Telefonlar va planshetlar","Телефонҳо ва планшетҳо","Телефоны и планшеты"],["pc","💻","Kompyuterlar va noutbuklar","Компютерҳо ва ноутбукҳо","Компьютеры и ноутбуки"],["tv","📺","Televizorlar va audio texnika","Телевизорҳо ва аудио","Телевизоры и аудио"],["home","🧊","Maishiy texnika","Техникаи маишӣ","Бытовая техника"],["cars","🚗","Avtomobillar va transport","Мошинҳо ва нақлиёт","Авто и транспорт"],["realty","🏠","Uy-joy va ko‘chmas mulk","Манзил ва амвол","Недвижимость"],["clothes","👕","Kiyim-kechak va poyabzal","Либос ва пойафзол","Одежда и обувь"],["furn","🛋️","Mebel va uy jihozlari","Мебел ва рӯзғор","Мебель и товары для дома"],["pets","🐾","Hayvonlar","Ҳайвонот","Животные"],["jobs","🛠️","Ish va xizmatlar","Кор ва хизматрасонӣ","Работа и услуги"],["kids","🧸","Bolalar va o‘yinchoqlar","Кӯдакон ва бозичаҳо","Детям и игрушки"],["sport","⚽","Sport va dam olish","Варзиш ва истироҳат","Спорт и отдых"],["build","🧱","Qurilish va ta’mirlash","Сохтмон ва таъмир","Строительство и ремонт"],["agri","🌾","Qishloq xo‘jaligi","Кишоварзӣ","Сельское хозяйство"],["business","🏪","Biznes va savdo jihozlari","Бизнес ва таҷҳизоти савдо","Бизнес и торговое оборудование"],["personal","🧳","Shaxsiy buyumlar","Ашёи шахсӣ","Личные вещи"],["books","📚","Kitoblar va ta’lim","Китоб ва маориф","Книги и образование"],["beauty","💄","Go‘zallik va parvarish","Зебоӣ ва нигоҳубин","Красота и уход"],["food","🥬","Oziq-ovqat mahsulotlari","Маҳсулоти хӯрокворӣ","Продукты питания"],["music","🎸","Musiqa va cholg‘u asboblari","Мусиқӣ ва асбобҳо","Музыка и инструменты"],["other","📦","Boshqa mahsulotlar","Дигар молҳо","Другое"]];
const CITIES=["Душанбе","Хуҷанд","Бохтар","Кӯлоб","Истаравшан","Исфара","Б. Ғафуров","Спитамен","Ҷ. Расулов","Панҷакент","Ҳисор","Вахдат","Турсунзода","Дигар ҳудудлар"];
const L={uz:{home:"Bosh sahifa",favs:"Sevimlilar",post:"E’lon",me:"Profil",login:"Kirish",reg:"Ro‘yxatdan o‘tish",out:"Chiqish",q:"Qidirish...",all:"Hammasi",city:"Shahar",dist:"Tuman",cond:"Holati",new:"Yangi",used:"Ishlatilgan",pf:"Narx dan",pt:"Narx gacha",sort:"Saralash",s1:"Yangilari",s2:"Arzonlari",s3:"Qimmatlari",title:"Nomi",descr:"Tavsif",price:"Narxi (TJS)",photos:"Rasmlar (6 tagacha)",save:"Saqlash",del:"O‘chirish",edit:"Tahrirlash",call:"Qo‘ng‘iroq",tg:"Telegram",rep:"Shikoyat",why:"Shikoyat sababi:",sent:"Yuborildi",more:"Yana",none:"E’lonlar topilmadi",name:"Ism",phone:"Telefon",pass:"Parol (8+)",mine:"Mening e’lonlarim",ok:"Saqlandi",err:"Xatolik: ",need:"Avval tizimga kiring",admin:"Admin",hide:"Yashirish",show:"Ko‘rsatish",res:"Yopish",reps:"Shikoyatlar",lst:"E’lonlar",sure:"Ishonchingiz komilmi?",deny:"Ruxsat yo‘q",cat:"Turkum",hid:"Yashirin",chk:"Emailni tasdiqlang yoki qayta kiring"},
tg:{home:"Асосӣ",favs:"Дӯстдошта",post:"Эълон",me:"Профил",login:"Ворид шудан",reg:"Бақайдгирӣ",out:"Баромадан",q:"Ҷустуҷӯ...",all:"Ҳама",city:"Шаҳр",dist:"Ноҳия",cond:"Ҳолат",new:"Нав",used:"Истифодашуда",pf:"Нарх аз",pt:"Нарх то",sort:"Тартиб",s1:"Навҳо",s2:"Арзонҳо",s3:"Гаронҳо",title:"Ном",descr:"Тавсиф",price:"Нарх (TJS)",photos:"Аксҳо (то 6)",save:"Нигоҳ доштан",del:"Нест кардан",edit:"Таҳрир",call:"Занг",tg:"Telegram",rep:"Шикоят",why:"Сабаби шикоят:",sent:"Фиристода шуд",more:"Боз",none:"Эълон ёфт нашуд",name:"Ном",phone:"Телефон",pass:"Рамз (8+)",mine:"Эълонҳои ман",ok:"Нигоҳ дошта шуд",err:"Хато: ",need:"Аввал ворид шавед",admin:"Админ",hide:"Пинҳон",show:"Нишон",res:"Бастан",reps:"Шикоятҳо",lst:"Эълонҳо",sure:"Боварӣ доред?",deny:"Иҷозат нест",cat:"Категория",hid:"Пинҳон",chk:"Emailро тасдиқ кунед ё дубора ворид шавед"},
ru:{home:"Главная",favs:"Избранное",post:"Объявление",me:"Профиль",login:"Войти",reg:"Регистрация",out:"Выйти",q:"Поиск...",all:"Все",city:"Город",dist:"Район",cond:"Состояние",new:"Новое",used:"Б/у",pf:"Цена от",pt:"Цена до",sort:"Сортировка",s1:"Новые",s2:"Дешевле",s3:"Дороже",title:"Название",descr:"Описание",price:"Цена (TJS)",photos:"Фото (до 6)",save:"Сохранить",del:"Удалить",edit:"Изменить",call:"Позвонить",tg:"Telegram",rep:"Жалоба",why:"Причина жалобы:",sent:"Отправлено",more:"Ещё",none:"Объявлений нет",name:"Имя",phone:"Телефон",pass:"Пароль (8+)",mine:"Мои объявления",ok:"Сохранено",err:"Ошибка: ",need:"Сначала войдите",admin:"Админ",hide:"Скрыть",show:"Показать",res:"Закрыть",reps:"Жалобы",lst:"Объявления",sure:"Вы уверены?",deny:"Нет доступа",cat:"Категория",hid:"Скрыто",chk:"Подтвердите email или войдите снова"}};
let lang=localStorage.lang||"uz",me=null,favs=new Set(),F={cat:"",q:"",city:"",cond:"",min:"",max:"",sort:"new",n:1},mode="login";
const t=k=>L[lang][k]||k,$=s=>document.querySelector(s),app=$("#app"),LI={uz:2,tg:3,ru:4};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n).toLocaleString("ru-RU")+" TJS",cn=s=>(CATS.find(c=>c[0]===s)||CATS[CATS.length-1])[LI[lang]];
const toast=m=>{const e=$("#toast");e.textContent=m;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2200)};
const fail=e=>toast(t("err")+(e.message||e)),adm=()=>me&&me.role==="admin";
const opts=(a,sel,f)=>a.map(x=>`<option value="${esc(f?x[0]:x)}"${(f?x[0]:x)===sel?" selected":""}>${esc(f?f(x):x)}</option>`).join("");
const card=l=>`<a class="card" href="#/l/${l.id}"><div class="ph">${l.images&&l.images[0]?`<img loading="lazy" src="${esc(l.images[0])}" alt="">`:"📷"}</div><div class="in"><b>${fmt(l.price)}</b><span>${esc(l.title)}</span><small>${esc(l.city)} · ${new Date(l.created_at).toLocaleDateString("ru-RU")}</small></div></a>`;
const comp=f=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1200/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(new Error("img")),"image/jpeg",.8)};i.onerror=()=>no(new Error("img"));i.src=URL.createObjectURL(f)});
const path=u=>{const i=u.indexOf("/images/");return i<0?null:decodeURIComponent(u.slice(i+8))};
const rmImgs=a=>{const p=(a||[]).map(path).filter(Boolean);return p.length?sb.storage.from("images").remove(p):0};

async function refreshMe(){const{data:{session}}=await sb.auth.getSession();if(!session){me=null;favs=new Set();return}
const[a,b]=await Promise.all([sb.from("profiles").select("*").eq("id",session.user.id).single(),sb.from("favorites").select("listing_id")]);
me=Object.assign({},a.data,{id:session.user.id,email:session.user.email});favs=new Set((b.data||[]).map(x=>x.listing_id))}
function nav(){const h=location.hash||"#/";const it=[["#/","🏠",t("home")],["#/favs","♥",t("favs")],["#/post","＋",t("post")],[me?"#/me":"#/auth","👤",me?t("me"):t("login")]];
$("#nav").innerHTML=it.map(x=>`<a href="${x[0]}" class="${h===x[0]?"on":""}"><span>${x[1]}</span>${esc(x[2])}</a>`).join("")}

async function home(){
app.innerHTML=`<input id="q" placeholder="${t("q")}" value="${esc(F.q)}"><h2>${t("cat")}</h2><div class="catgrid"><button class="catitem${F.cat?"":" on"}" data-c=""><span class="ico">▦</span><span class="ctxt">${t("all")}</span></button>${CATS.map(c=>`<button class="catitem${F.cat===c[0]?" on":""}" data-c="${c[0]}"><span class="ico">${c[1]}</span><span class="ctxt">${esc(c[LI[lang]])}</span></button>`).join("")}</div>
<div class="row"><select id="fc"><option value="">${t("city")}: ${t("all")}</option>${opts(CITIES,F.city)}</select><select id="fd"><option value="">${t("cond")}: ${t("all")}</option><option value="new"${F.cond==="new"?" selected":""}>${t("new")}</option><option value="used"${F.cond==="used"?" selected":""}>${t("used")}</option></select><select id="fs"><option value="new">${t("s1")}</option><option value="asc"${F.sort==="asc"?" selected":""}>${t("s2")}</option><option value="desc"${F.sort==="desc"?" selected":""}>${t("s3")}</option></select></div>
<div class="row"><input id="pf" type="number" min="0" placeholder="${t("pf")}" value="${esc(F.min)}"><input id="pt" type="number" min="0" placeholder="${t("pt")}" value="${esc(F.max)}"></div><div id="list"></div>`;
const go=()=>{F.n=1;list()};let tm;
$("#q").oninput=e=>{F.q=e.target.value;clearTimeout(tm);tm=setTimeout(go,350)};
$("#fc").onchange=e=>{F.city=e.target.value;go()};$("#fd").onchange=e=>{F.cond=e.target.value;go()};$("#fs").onchange=e=>{F.sort=e.target.value;go()};
$("#pf").onchange=e=>{F.min=e.target.value;go()};$("#pt").onchange=e=>{F.max=e.target.value;go()};
app.querySelector(".catgrid").onclick=e=>{const c=e.target.closest("[data-c]");if(c){F.cat=c.dataset.c;home()}};list()}
async function list(){
let q=sb.from("listings").select("id,title,price,city,images,created_at",{count:"exact"}).eq("status","active");
if(F.cat)q=q.eq("cat",F.cat);if(F.city)q=q.eq("city",F.city);if(F.cond)q=q.eq("cond",F.cond);if(F.min!=="")q=q.gte("price",F.min);if(F.max!=="")q=q.lte("price",F.max);
if(F.q.trim())q=q.ilike("title","%"+F.q.replace(/[%,_()]/g," ").trim()+"%");
q=(F.sort==="new"?q.order("created_at",{ascending:false}):q.order("price",{ascending:F.sort==="asc"})).range(0,F.n*20-1);
const{data,count,error}=await q;if(error)return fail(error);const el=$("#list");if(!el)return;
el.innerHTML=data.length?`<div class="grid">${data.map(card).join("")}</div>`+(count>data.length?`<p style="text-align:center;margin:14px"><button class="btn g" id="more">${t("more")}</button></p>`:""):`<p class="empty">${t("none")}</p>`;
const m=$("#more");if(m)m.onclick=()=>{F.n++;list()}}

async function favsV(){if(!me){location.hash="#/auth";return}
const{data,error}=await sb.from("favorites").select("listings(id,title,price,city,images,created_at,status)").order("listing_id",{ascending:false});if(error)return fail(error);
const a=(data||[]).map(x=>x.listings).filter(x=>x&&x.status==="active");
app.innerHTML=`<h1>♥ ${t("favs")}</h1>`+(a.length?`<div class="grid">${a.map(card).join("")}</div>`:`<p class="empty">${t("none")}</p>`)}

async function detail(id){
const{data:l,error}=await sb.from("listings").select("*,profiles(name,phone,telegram)").eq("id",id).maybeSingle();
if(error||!l){app.innerHTML=`<p class="empty">${t("none")}</p>`;return}
const p=l.profiles||{},own=me&&me.id===l.user_id,tgu=(p.telegram||"").replace(/^@/,"").replace(/[^\w]/g,""),ph=(p.phone||"").replace(/[^\d+]/g,"");
app.innerHTML=`${l.images.length?`<div class="gal">${l.images.map(u=>`<img src="${esc(u)}" alt="">`).join("")}</div>`:""}
<h1>${esc(l.title)}</h1><h2 style="color:var(--sky)">${fmt(l.price)}</h2>
<small>${esc(cn(l.cat))} · ${t(l.cond)} · ${esc(l.city)}${l.district?", "+esc(l.district):""} · ${new Date(l.created_at).toLocaleDateString("ru-RU")}${l.status==="hidden"?" · "+t("hid"):""}</small>
<div class="box" style="white-space:pre-wrap">${esc(l.descr||"")}</div>
<div class="box"><b>${esc(p.name||"")}</b><div class="row">${ph?`<a class="btn" href="tel:${esc(ph)}">📞 ${t("call")}: ${esc(p.phone)}</a>`:""}${tgu?`<a class="btn g" target="_blank" rel="noopener" href="https://t.me/${esc(tgu)}">✈ ${t("tg")}</a>`:""}</div></div>
<div class="row"><button class="btn g" data-a="fav" data-id="${l.id}">${favs.has(l.id)?"♥":"♡"} ${t("favs")}</button><button class="btn g" data-a="rep" data-id="${l.id}">⚑ ${t("rep")}</button>
${own||adm()?`<a class="btn g" href="#/post/${l.id}">${t("edit")}</a><button class="btn r" data-a="del" data-id="${l.id}">${t("del")}</button>`:""}${adm()?`<button class="btn g" data-a="${l.status==="active"?"hide":"show"}" data-id="${l.id}">${l.status==="active"?t("hide"):t("show")}</button>`:""}</div>`}

async function postV(id){
if(!me){location.hash="#/auth";toast(t("need"));return}
let old=null;if(id){const r=await sb.from("listings").select("*").eq("id",id).maybeSingle();old=r.data;if(!old||(old.user_id!==me.id&&!adm())){app.innerHTML=`<p class="empty">${t("deny")}</p>`;return}}
let imgs=[...(old?old.images:[])],files=[];const o=old||{cat:"phones",cond:"used",city:CITIES[0]};
app.innerHTML=`<h1>${old?t("edit"):t("post")}</h1><form class="box" id="pf2"><label>${t("cat")}</label><select name="cat">${opts(CATS,o.cat,c=>c[1]+" "+c[LI[lang]])}</select>
<label>${t("title")}</label><input name="title" required minlength="3" maxlength="120" value="${esc(o.title)}"><label>${t("descr")}</label><textarea name="descr" maxlength="3000">${esc(o.descr)}</textarea>
<label>${t("price")}</label><input name="price" type="number" min="0" step="0.01" required value="${esc(o.price)}"><label>${t("cond")}</label><select name="cond"><option value="new"${o.cond==="new"?" selected":""}>${t("new")}</option><option value="used"${o.cond==="used"?" selected":""}>${t("used")}</option></select>
<label>${t("city")}</label><select name="city">${opts(CITIES,o.city)}</select><label>${t("dist")}</label><input name="district" maxlength="80" value="${esc(o.district)}">
<label>${t("photos")}</label><input type="file" id="fi" accept="image/*" multiple><div class="thumbs" id="th"></div><p style="margin-top:14px"><button class="btn" id="sv">${t("save")}</button></p></form>`;
const th=()=>{$("#th").innerHTML=imgs.map((u,i)=>`<div><img src="${esc(u)}" alt=""><button type="button" data-i="${i}">×</button></div>`).join("")+files.map((f,i)=>`<div><img src="${URL.createObjectURL(f)}" alt=""><button type="button" data-f="${i}">×</button></div>`).join("")};th();
$("#fi").onchange=e=>{for(const f of e.target.files)if(imgs.length+files.length<6)files.push(f);e.target.value="";th()};
$("#th").onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.i!=null)imgs.splice(+b.dataset.i,1);else files.splice(+b.dataset.f,1);th()};
$("#pf2").onsubmit=async e=>{e.preventDefault();const b=$("#sv");b.disabled=true;
try{if(!me.phone){throw new Error(t("phone"))}const up=[];
for(const[i,f]of files.entries()){const bl=await comp(f),pa=`${me.id}/${Date.now()}_${i}.jpg`,r=await sb.storage.from("images").upload(pa,bl,{contentType:"image/jpeg"});if(r.error)throw r.error;up.push(sb.storage.from("images").getPublicUrl(pa).data.publicUrl)}
const d=Object.fromEntries(new FormData(e.target));const row={cat:d.cat,title:d.title.trim(),descr:d.descr.trim(),price:+d.price,cond:d.cond,city:d.city,district:d.district.trim()||null,images:[...imgs,...up]};
const r=old?await sb.from("listings").update(row).eq("id",old.id).select("id").single():await sb.from("listings").insert(row).select("id").single();if(r.error)throw r.error;
if(old)await rmImgs(old.images.filter(u=>!imgs.includes(u)));toast(t("ok"));location.hash="#/l/"+r.data.id}catch(x){fail(x)}b.disabled=false}}

function authV(){if(me){location.hash="#/me";return}const r=mode==="reg";
app.innerHTML=`<h1>${r?t("reg"):t("login")}</h1><form class="box" id="af">${r?`<label>${t("name")}</label><input name="name" required maxlength="80"><label>${t("phone")}</label><input name="phone" type="tel" required placeholder="+992..."><label>Telegram</label><input name="telegram" placeholder="@username">`:""}
<label>Email</label><input name="email" type="email" required autocomplete="email"><label>${t("pass")}</label><input name="pw" type="password" required minlength="8" autocomplete="${r?"new":"current"}-password"><p style="margin-top:14px"><button class="btn">${r?t("reg"):t("login")}</button> <button type="button" class="btn g" id="sw">${r?t("login"):t("reg")}</button></p></form>`;
$("#sw").onclick=()=>{mode=r?"login":"reg";authV()};
$("#af").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
const res=r?await sb.auth.signUp({email:d.email,password:d.pw,options:{data:{name:d.name,phone:d.phone,telegram:d.telegram}}}):await sb.auth.signInWithPassword({email:d.email,password:d.pw});
if(res.error)return fail(res.error);if(r&&!res.data.session){toast(t("chk"));mode="login";return authV()}await refreshMe();location.hash="#/me"}}

async function meV(){if(!me){location.hash="#/auth";return}
const{data}=await sb.from("listings").select("id,title,price,status").eq("user_id",me.id).order("created_at",{ascending:false});
app.innerHTML=`<h1>${esc(me.name)}</h1><small>${esc(me.email)}${adm()?" · "+t("admin"):""}</small><form class="box" id="pr"><label>${t("name")}</label><input name="name" required value="${esc(me.name)}"><label>${t("phone")}</label><input name="phone" type="tel" required value="${esc(me.phone)}"><label>Telegram</label><input name="telegram" value="${esc(me.telegram)}"><p style="margin-top:12px"><button class="btn">${t("save")}</button></p></form>
<div class="row">${adm()?`<a class="btn g" href="#/admin">⚙ ${t("admin")}</a>`:""}<button class="btn g" data-a="out">${t("out")}</button></div><h2>${t("mine")}</h2>
${(data||[]).map(l=>`<div class="li"><a href="#/l/${l.id}">${esc(l.title)}<br><small>${fmt(l.price)}${l.status==="hidden"?" · "+t("hid"):""}</small></a><a class="btn g sm" href="#/post/${l.id}">${t("edit")}</a><button class="btn r sm" data-a="del" data-id="${l.id}">${t("del")}</button></div>`).join("")||`<p class="empty">${t("none")}</p>`}`;
$("#pr").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const r=await sb.from("profiles").update({name:d.name.trim(),phone:d.phone.trim(),telegram:d.telegram.trim()}).eq("id",me.id);if(r.error)return fail(r.error);await refreshMe();toast(t("ok"))}}

async function adminV(){if(!adm()){app.innerHTML=`<p class="empty">${t("deny")}</p>`;return}
const[a,b]=await Promise.all([sb.from("listings").select("id,title,price,status,city").order("created_at",{ascending:false}).limit(60),sb.from("reports").select("id,reason,resolved,listing_id,listings(title)").order("created_at",{ascending:false}).limit(60)]);
app.innerHTML=`<h1>⚙ ${t("admin")}</h1><h2>${t("reps")}</h2>${(b.data||[]).map(r=>`<div class="li"><a href="#/l/${r.listing_id}">${esc(r.listings?r.listings.title:"—")}<br><small>${esc(r.reason)}${r.resolved?" ✓":""}</small></a>${r.resolved?"":`<button class="btn g sm" data-a="res" data-id="${r.id}">${t("res")}</button>`}</div>`).join("")||`<p class="empty">—</p>`}
<h2>${t("lst")}</h2>${(a.data||[]).map(l=>`<div class="li"><a href="#/l/${l.id}">${esc(l.title)}<br><small>${fmt(l.price)} · ${esc(l.city)}${l.status==="hidden"?" · "+t("hid"):""}</small></a><button class="btn g sm" data-a="${l.status==="active"?"hide":"show"}" data-id="${l.id}">${l.status==="active"?t("hide"):t("show")}</button><button class="btn r sm" data-a="del" data-id="${l.id}">${t("del")}</button></div>`).join("")}`}

app.onclick=async e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,id=+b.dataset.id;
try{if(a==="out"){await sb.auth.signOut();me=null;favs=new Set();location.hash="#/";return route()}
if(!me)return(location.hash="#/auth",toast(t("need")));
if(a==="fav"){if(favs.has(id)){await sb.from("favorites").delete().eq("listing_id",id);favs.delete(id)}else{const r=await sb.from("favorites").insert({listing_id:id});if(r.error)throw r.error;favs.add(id)}return route()}
if(a==="rep"){const w=prompt(t("why"));if(!w||w.trim().length<3)return;const r=await sb.from("reports").insert({listing_id:id,reason:w.trim().slice(0,500)});if(r.error)throw r.error;return toast(t("sent"))}
if(a==="del"){if(!confirm(t("sure")))return;const{data:l}=await sb.from("listings").select("images").eq("id",id).maybeSingle();const r=await sb.from("listings").delete().eq("id",id);if(r.error)throw r.error;if(l)await rmImgs(l.images);toast(t("ok"));if(location.hash.startsWith("#/l/"))location.hash="#/";else route();return}
if(a==="hide"||a==="show"){const r=await sb.rpc("admin_set_status",{lid:id,s:a==="hide"?"hidden":"active"});if(r.error)throw r.error;return route()}
if(a==="res"){const r=await sb.from("reports").update({resolved:true}).eq("id",id);if(r.error)throw r.error;return route()}}catch(x){fail(x)}};

async function route(){const h=location.hash.replace(/^#\/?/,"").split("/");nav();window.scrollTo(0,0);
try{switch(h[0]){case"l":return await detail(+h[1]);case"favs":return await favsV();case"post":return await postV(h[1]?+h[1]:null);case"auth":return authV();case"me":return await meV();case"admin":return await adminV();default:return await home()}}catch(x){fail(x)}}
$("#lg").value=lang;$("#lg").onchange=e=>{lang=e.target.value;localStorage.lang=lang;document.documentElement.lang=lang;route()};
sb.auth.onAuthStateChange((ev)=>{if(ev==="SIGNED_OUT"){me=null;nav()}});window.addEventListener("hashchange",route);
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
refreshMe().catch(()=>{}).then(route);
</script>
</body>
</html>
