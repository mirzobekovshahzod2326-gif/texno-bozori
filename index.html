app.innerHTML=`<h1>${r?t("reg"):t("login")}</h1><form class="box" id="af">${r?`<label>${t("name")}</label><input name="name" required maxlength="80">`:""}<label>${t("phone")}${r?"":" / Email"}</label><input name="id" required ${r?'type="tel" inputmode="tel" placeholder="+992 900 00 00 00"':'autocomplete="username"'}>${r?`<label>Telegram</label><input name="telegram" placeholder="@username">`:""}<label>${t("pass")}</label><input name="pw" type="password" required minlength="8" autocomplete="${r?"new":"current"}-password"><p style="margin-top:14px"><button class="btn">${r?t("reg"):t("login")}</button> <button type="button" class="btn g" id="sw">${r?t("login"):t("reg")}</button></p></form>`;
$("#sw").onclick=()=>{mode=r?"login":"reg";authV()};
$("#af").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
try{const em=r?normPh(d.id).length>=9&&normPh(d.id).length<=15?normPh(d.id)+"@"+DOM:idEmail("x"):idEmail(d.id);const res=r?await sb.auth.signUp({email:em,password:d.pw,options:{data:{name:d.name,phone:"+"+normPh(d.id),telegram:d.telegram}}}):await sb.auth.signInWithPassword({email:em,password:d.pw});
if(res.error)throw res.error;if(r&&!res.data.session){toast(t("chk"));mode="login";return authV()}await refreshMe();location.hash="#/me"}catch(x){fail(x)}}}

const sq=f=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const m=Math.min(i.width,i.height),c=document.createElement("canvas");c.width=c.height=400;c.getContext("2d").drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,400,400);c.toBlob(b=>b?ok(b):no(new Error("img")),"image/jpeg",.85)};i.onerror=()=>no(new Error("img"));i.src=URL.createObjectURL(f)});
async function meV(){if(!me){location.hash="#/auth";return}
const items=must(await sb.from("listings").select("id,title,price,status,images").eq("user_id",me.id).order("created_at",{ascending:false})),act=items.filter(x=>x.status==="active").length;
const shown=me.email&&me.email.endsWith("@"+DOM)?me.phone:me.email;
app.innerHTML=`<div class="pcover"></div><section class="pcard"><div class="pwrap">${av(me,"pav")}<label class="pcam" for="avf" title="${t("photo")}">📷</label><input type="file" id="avf" accept="image/*" hidden></div><h1>${esc(me.name)}</h1><small>${esc(shown||"")}</small>${adm()?`<div><span class="badge">⚙ ${t("admin")}</span></div>`:""}
<div class="dash"><div class="dc"><b>${items.length}</b><span>${t("tot")}</span></div><div class="dc"><b>${act}</b><span>${t("act")}</span></div><div class="dc"><b>${items.length-act}</b><span>${t("hidn")}</span></div><div class="dc"><b>${favs.size}</b><span>${t("favs")}</span></div></div></section>
<section class="box"><b>${t("pers")} 🔒</b><form id="pr"><label>${t("name")}</label><input name="name" required maxlength="80" value="${esc(me.name)}"><label>${t("phone")}</label><input name="phone" type="tel" required maxlength="30" value="${esc(me.phone)}"><label>Telegram</label><input name="telegram" maxlength="40" value="${esc(me.telegram)}"><p style="margin-top:12px"><button class="btn">${t("save")}</button></p></form></section>
<div class="row">${adm()?`<a class="btn g" href="#/admin">⚙ ${t("admin")}</a>`:""}<a class="btn g" href="#/post">＋ ${t("post")}</a><button class="btn g" data-a="out">${t("out")}</button></div><h2>${t("mine")}</h2>
${items.map(l=>`<div class="mc"><a class="mt" href="#/l/${l.id}">${l.images&&l.images[0]?`<img src="${esc(l.images[0])}" alt="">`:"📷"}</a><div class="mi"><a href="#/l/${l.id}"><b>${esc(l.title)}</b></a><small>${fmt(l.price)}</small><span class="st1${l.status==="hidden"?" h":""}">${l.status==="hidden"?t("hid"):t("act")}</span><div class="r2"><a class="btn g sm" href="#/post/${l.id}">${t("edit")}</a><button class="btn r sm" data-a="del" data-id="${l.id}">${t("del")}</button></div></div></div>`).join("")||`<p class="empty">${t("none")}</p>`}`;
$("#avf").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
try{toast(t("load"));const bl=await sq(f),pa=`${me.id}/avatar_${Date.now()}.jpg`;must(await sb.storage.from("images").upload(pa,bl,{contentType:"image/jpeg"}));
const url=sb.storage.from("images").getPublicUrl(pa).data.publicUrl,old=me.avatar_url,r=await sb.from("profiles").update({avatar_url:url}).eq("id",me.id).select("id");
if(r.error){await rmImgs([url]);throw new Error(/avatar_url|column|permission/i.test(r.error.message)?t("avh"):r.error.message)}
if(old)await rmImgs([old]);await refreshMe();toast(t("ok"));meV()}catch(x){fail(x)}};
$("#pr").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{must(await sb.from("profiles").update({name:d.name.trim(),phone:d.phone.trim(),telegram:d.telegram.trim()}).eq("id",me.id).select("id"));await refreshMe();toast(t("ok"));meV()}catch(x){fail(x)}}}

async function adminV(){if(!adm()){app.innerHTML=`<p class="empty">${t("deny")}</p>`;return}
const[a,b]=await Promise.all([sb.from("listings").select("id,title,price,status,city").order("created_at",{ascending:false}).limit(60),sb.from("reports").select("id,reason,resolved,listing_id").order("created_at",{ascending:false}).limit(60)]);
const L=must(a),R=must(b),ids=[...new Set(R.map(r=>r.listing_id))],T=new Map();
if(ids.length)must(await sb.from("listings").select("id,title").in("id",ids)).forEach(x=>T.set(x.id,x.title));
app.innerHTML=`<h1>⚙ ${t("admin")}</h1><h2>${t("reps")}</h2>${R.map(r=>`<div class="li"><a href="#/l/${r.listing_id}">${esc(T.get(r.listing_id)||"—")}<br><small>${esc(r.reason)}${r.resolved?" ✓":""}</small></a>${r.resolved?"":`<button class="btn g sm" data-a="res" data-id="${r.id}">${t("res")}</button>`}</div>`).join("")||`<p class="empty">—</p>`}
<h2>${t("lst")}</h2>${L.map(l=>`<div class="li"><a href="#/l/${l.id}">${esc(l.title)}<br><small>${fmt(l.price)} · ${esc(l.city)}${l.status==="hidden"?" · "+t("hid"):""}</small></a><button class="btn g sm" data-a="${l.status==="active"?"hide":"show"}" data-id="${l.id}">${l.status==="active"?t("hide"):t("show")}</button><button class="btn r sm" data-a="del" data-id="${l.id}">${t("del")}</button></div>`).join("")}`}

app.onclick=async e=>{const hh=e.target.closest("[data-h]");if(hh){e.preventDefault();return toggleFav(+hh.dataset.h)}const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,id=+b.dataset.id;
try{if(a==="out"){await sb.auth.signOut();me=null;favs=new Set();unread=0;watchInbox();location.hash="#/";return route()}
if(!me)return(location.hash="#/auth",toast(t("need")));
if(a==="chat")return await startChat(+b.dataset.l,b.dataset.s);
if(a==="fav"){if(favs.has(id)){must(await sb.from("favorites").delete().eq("listing_id",id).select());favs.delete(id)}else{must(await sb.from("favorites").insert({listing_id:id}).select());favs.add(id)}return route()}
if(a==="rep"){const w=prompt(t("why"));if(!w||w.trim().length<3)return;must(await sb.from("reports").insert({listing_id:id,reason:w.trim().slice(0,500)}).select());return toast(t("sent"))}
if(a==="del"){if(!confirm(t("sure")))return;const l=must(await sb.from("listings").select("images").eq("id",id).maybeSingle());must(await sb.from("listings").delete().eq("id",id).select());if(l)await rmImgs(l.images);toast(t("ok"));if(location.hash.startsWith("#/l/"))location.hash="#/";else route();return}
if(a==="hide"||a==="show"){must(await sb.rpc("admin_set_status",{lid:id,s:a==="hide"?"hidden":"active"}));return route()}
if(a==="res"){must(await sb.from("reports").update({resolved:true}).eq("id",id).select());return route()}}catch(x){fail(x)}};

async function route(){const h=location.hash.replace(/^#\/?/,"").split("/");if(chan){if(chan.rch)sb.removeChannel(chan.rch);sb.removeChannel(chan);chan=null}clearInterval(bnT);document.body.classList.toggle("inchat",h[0]==="chat");nav();window.scrollTo(0,0);
try{switch(h[0]){case"l":return await detail(+h[1]);case"favs":return await favsV();case"browse":return await browseV(h[1]);case"chats":return await chatsV();case"chat":return await chatV(h[1]);case"post":return await postV(h[1]?+h[1]:null);case"auth":return authV();case"me":return await meV();case"admin":return await adminV();default:return await home()}}catch(x){fail(x);app.innerHTML=`<div class="empty" style="word-break:break-word"><b>${esc(t("err"))}</b><br>${esc((x&&x.message)||x)}</div>`}}
$("#bell").onclick=()=>{location.hash=me?"#/chats":"#/auth"};$("#lg").value=lang;document.documentElement.lang=lang;$("#lg").onchange=e=>{lang=e.target.value;localStorage.lang=lang;document.documentElement.lang=lang;route()};
sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT"){me=null;unread=0;nav()}});window.addEventListener("hashchange",route);
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
{const _n=nav;nav=function(){_n();const b=$("#bb");if(b){b.hidden=!(unread>0);b.textContent=unread>99?"99+":unread}}}
refreshMe().catch(fail).finally(route);
</script>
