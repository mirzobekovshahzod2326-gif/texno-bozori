 box.innerHTML=rows.map(c=>{const other=c.buyer_id===me.id?c.seller_id:c.buyer_id,l=listings.get(c.listing_id)||{},m=last.get(c.id),label=m?(m.sticker||m.body||"📎"):chatT("noMessages"),u=unread.get(c.id)||0;return `<a class="chat-item" href="#/chat/${c.id}"><div class="chat-avatar">${esc((users.get(other)||"?" ).slice(0,1).toUpperCase())}</div><div class="chat-item-main"><div class="chat-item-top"><span class="chat-item-name">${esc(users.get(other)||"Foydalanuvchi")}</span><span class="chat-time">${chatDate(m?m.created_at:c.last_message_at||c.created_at)}</span></div><span class="chat-preview">${esc(l.title||chatT("listing"))} · ${esc(label)}</span></div>${u?`<span class="chat-unread">${u>99?"99+":u}</span>`:""}</a>`}).join("");
}
function messageHTML(m){const mine=m.sender_id===me.id,sticker=!!m.sticker;return `<div class="chat-msg ${mine?"mine":"theirs"} ${sticker?"chat-msg-sticker":""}" data-message-id="${m.id}">${sticker?esc(m.sticker):esc(m.body||"")}<div class="chat-msg-meta"><span>${chatTime(m.created_at)}</span>${mine?`<span>${m.read_at?"✓✓":"✓"}</span>`:""}</div></div>`}
async function markChatRead(id){const r=await sb.from("messages").update({read_at:new Date().toISOString()}).eq("conversation_id",id).neq("sender_id",me.id).is("read_at",null);if(r.error)console.warn("Read receipt:",r.error.message)}
async function chatV(id){
 if(!me){location.hash="#/auth";return}
 if(activeChatChannel){await sb.removeChannel(activeChatChannel);activeChatChannel=null}activeChatId=id;
 const cr=await sb.from("conversations").select("id,listing_id,buyer_id,seller_id").eq("id",id).maybeSingle();if(cr.error)throw cr.error;if(!cr.data){app.innerHTML=`<div class="chat-empty">${chatT("chatError")}</div>`;return}
 const c=cr.data,other=c.buyer_id===me.id?c.seller_id:c.buyer_id;if(c.buyer_id!==me.id&&c.seller_id!==me.id){app.innerHTML=`<div class="chat-empty">Ruxsat yo‘q</div>`;return}
 const [pr,lr,mr]=await Promise.all([sb.from("profiles").select("id,name").eq("id",other).maybeSingle(),sb.from("listings").select("id,title,price,images").eq("id",c.listing_id).maybeSingle(),sb.from("messages").select("id,sender_id,body,sticker,created_at,read_at").eq("conversation_id",id).order("created_at",{ascending:true}).limit(100)]);
 if(pr.error)throw pr.error;if(lr.error)throw lr.error;if(mr.error)throw mr.error;
 const person=pr.data||{},listing=lr.data||{},messages=mr.data||[];
 app.innerHTML=`<div class="chat-shell"><section class="chat-window"><div class="chat-top"><button class="chat-back" id="chatBack" type="button" aria-label="Orqaga">‹</button><div class="chat-avatar">${esc((person.name||"?").slice(0,1).toUpperCase())}</div><div class="chat-top-info"><b>${esc(person.name||"Foydalanuvchi")}</b><span class="chat-status" id="chatStatus">${chatT("online")}</span></div></div><a class="chat-product" href="#/l/${listing.id||c.listing_id}">${listing.images&&listing.images[0]?`<img src="${esc(listing.images[0])}" alt="">`:`<div class="chat-avatar">📦</div>`}<span class="chat-product-info"><b>${esc(listing.title||chatT("listing"))}</b><small>${listing.price!=null?fmt(listing.price):""} · ${chatT("listing")}</small></span><span>›</span></a><div class="chat-messages" id="chatMessages">${messages.length?messages.map(messageHTML).join(""):`<div class="chat-empty">${chatT("noMessages")}</div>`}</div><div class="chat-typing" id="chatTyping"></div><div class="chat-composer-wrap"><div class="sticker-panel" id="stickerPanel" hidden>${CHAT_STICKERS.map(s=>`<button class="sticker-choice" type="button" data-sticker="${s}">${s}</button>`).join("")}</div><div class="chat-tools"><button class="chat-tool" id="stickerToggle" type="button" aria-label="${chatT("stickers")}" title="${chatT("stickers")}">☺</button><span class="form-help">${chatT("stickers")}</span></div><div class="chat-compose"><textarea id="chatInput" rows="1" maxlength="2000" placeholder="${chatT("write")}"></textarea><button class="chat-send" id="chatSend" type="button" aria-label="${chatT("send")}">➤</button></div></div></section></div>`;
 const msgBox=$("#chatMessages"),input=$("#chatInput"),send=$("#chatSend"),stickerPanel=$("#stickerPanel");
 const scrollBottom=()=>{msgBox.scrollTop=msgBox.scrollHeight};scrollBottom();await markChatRead(id);
 $("#chatBack").onclick=()=>{location.hash="#/chats"};
 $("#stickerToggle").onclick=()=>{stickerPanel.hidden=!stickerPanel.hidden};
 async function deliver(body,sticker){if(!body&&!sticker)return;if(send.disabled)return;send.disabled=true;try{const r=await sb.from("messages").insert({conversation_id:id,sender_id:me.id,body:body||null,sticker:sticker||null}).select("id,sender_id,body,sticker,created_at,read_at").single();if(r.error)throw r.error;const empty=msgBox.querySelector(".chat-empty");if(empty)empty.remove();if(!msgBox.querySelector(`[data-message-id="${r.data.id}"]`))msgBox.insertAdjacentHTML("beforeend",messageHTML(r.data));scrollBottom();input.value="";input.style.height="auto";stickerPanel.hidden=true;await channel.send({type:"broadcast",event:"typing",payload:{user_id:me.id,typing:false}})}catch(e){fail(e)}finally{send.disabled=false;input.focus()}}
 send.onclick=()=>deliver(input.value.trim(),null);
 input.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send.click()}};
 input.oninput=()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,112)+"px";channel.send({type:"broadcast",event:"typing",payload:{user_id:me.id,typing:!!input.value.trim()}});clearTimeout(typingTimer);typingTimer=setTimeout(()=>channel.send({type:"broadcast",event:"typing",payload:{user_id:me.id,typing:false}}),1300)};
 stickerPanel.onclick=e=>{const b=e.target.closest("[data-sticker]");if(b)deliver(null,b.dataset.sticker)};
 const channel=sb.channel("market-chat-"+id,{config:{presence:{key:me.id},broadcast:{self:false}}});
 channel.on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"conversation_id=eq."+id},async payload=>{const m=payload.new;if(!msgBox.querySelector(`[data-message-id="${m.id}"]`)){const empty=msgBox.querySelector(".chat-empty");if(empty)empty.remove();msgBox.insertAdjacentHTML("beforeend",messageHTML(m));scrollBottom()}if(m.sender_id!==me.id)await markChatRead(id)});
 channel.on("broadcast",{event:"typing"},({payload})=>{if(payload.user_id!==me.id)$("#chatTyping").textContent=payload.typing?chatT("typing"):""});
 channel.on("presence",{event:"sync"},()=>{const state=channel.presenceState();const online=Object.values(state).flat().some(x=>x.user_id===other);$("#chatStatus").textContent=online?chatT("online"):chatT("offline")});
 channel.subscribe(async status=>{if(status==="SUBSCRIBED"){await channel.track({user_id:me.id,online_at:new Date().toISOString()})}});activeChatChannel=channel;
}

let old=null;if(id){const r=await sb.from("listings").select("*").eq("id",id).maybeSingle();old=r.data;if(!old||(old.user_id!==me.id&&!adm())){app.innerHTML=`<p class="empty">${t("deny")}</p>`;return}}
let imgs=[...(old?old.images:[])],files=[];const o=old||{cat:"phones",cond:"used",city:CITIES[0]};
app.innerHTML=`<h1>${old?t("edit"):"E’lon joylashtirish"}</h1>

<label for="p-district">${t("dist")}</label><input id="p-district" name="district" maxlength="80" placeholder="Masalan: markaz, 20-mikrorayon" value="${esc(o.district)}"><p class="form-help">Joylashuv xaridorga mahsulot qayerdaligini tushunishga yordam beradi.</p></section>

<button class="btn post-submit" id="sv">${old?"O‘zgarishlarni saqlash":"✓ E’lonni joylashtirish"}</button><p class="form-help" style="text-align:center;margin:10px 0 18px">E’lon joylashtirish orqali ma’lumotlar to‘g‘riligini tasdiqlaysiz.</p></form>`;
const th=()=>{$("#th").innerHTML=imgs.map((u,i)=>`<div><img src="${esc(u)}" alt="Yuklangan rasm"><button type="button" data-i="${i}" aria-label="Rasmni olib tashlash">×</button></div>`).join("")+files.map((f,i)=>`<div><img src="${URL.createObjectURL(f)}" alt="Yangi rasm"><button type="button" data-f="${i}" aria-label="Rasmni olib tashlash">×</button></div>`).join("")+(!imgs.length&&!files.length?`<p class="form-help">Hozircha rasm tanlanmagan.</p>`:"")};th();
$("#fi").onchange=e=>{for(const f of e.target.files){if(imgs.length+files.length>=6)break;if(!f.type.startsWith("image/"))continue;files.push(f)}e.target.value="";th()};
$("#th").onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.i!=null)imgs.splice(+b.dataset.i,1);else files.splice(+b.dataset.f,1);th()};
$("#pf2").onsubmit=async e=>{e.preventDefault();const b=$("#sv");b.disabled=true;b.textContent="Saqlanmoqda...";
try{if(!me.phone){throw new Error(t("phone"))}const up=[];
for(const[i,f]of files.entries()){const bl=await comp(f),pa=`${me.id}/${Date.now()}_${i}.jpg`,r=await sb.storage.from("images").upload(pa,bl,{contentType:"image/jpeg"});if(r.error)throw r.error;up.push(sb.storage.from("images").getPublicUrl(pa).data.publicUrl)}
const d=Object.fromEntries(new FormData(e.target));const row={cat:d.cat,title:d.title.trim(),descr:d.descr.trim(),price:+d.price,cond:d.cond,city:d.city,district:d.district.trim()||null,images:[...imgs,...up]};
const r=old?await sb.from("listings").update(row).eq("id",old.id).select("id").single():await sb.from("listings").insert(row).select("id").single();if(r.error)throw r.error;
if(old)await rmImgs(old.images.filter(u=>!imgs.includes(u)));toast(t("ok"));location.hash="#/l/"+r.data.id}catch(x){fail(x)}b.disabled=false;b.textContent=old?"O‘zgarishlarni saqlash":"✓ E’lonni joylashtirish"}}
function authV(){if(me){location.hash="#/me";return}const r=mode==="reg";
app.innerHTML=`<h1>${r?t("reg"):t("login")}</h1><form class="box" id="af">${r?`<label>${t("name")}</label><input name="name" required maxlength="80"><label>${t("phone")}</label><input name="phone" type="tel" required placeholder="+992..."><label>Telegram</label><input name="telegram" placeholder="@username">`:""}
<label>Email</label><input name="email" type="email" required autocomplete="email"><label>${t("pass")}</label><input name="pw" type="password" required minlength="8" autocomplete="${r?"new":"current"}-password"><p style="margin-top:14px"><button class="btn">${r?t("reg"):t("login")}</button> <button type="button" class="btn g" id="sw">${r?t("login"):t("reg")}</button></p></form>`;

async function meV(){if(!me){location.hash="#/auth";return}
const{data,error}=await sb.from("listings").select("id,title,price,status").eq("user_id",me.id).order("created_at",{ascending:false});

const items=data||[],active=items.filter(x=>x.status==="active").length,hidden=items.length-active;

async function adminV(){if(!adm()){app.innerHTML=`<p class="empty">${t("deny")}</p>`;return}
const[a,b]=await Promise.all([sb.from("listings").select("id,title,price,status,city").order("created_at",{ascending:false}).limit(60),sb.from("reports").select("id,reason,resolved,listing_id,listings(title)").order("created_at",{ascending:false}).limit(60)]);
app.innerHTML=`<h1>⚙ ${t("admin")}</h1><h2>${t("reps")}</h2>${(b.data||[]).map(r=>`<div class="li"><a href="#/l/${r.listing_id}">${esc(r.listings?r.listings.title:"—")}<br><small>${esc(r.reason)}${r.resolved?" ✓":""}</small></a>${r.resolved?"":`<button class="btn g sm" data-a="res" data-id="${r.id}">${t("res")}</button>`}</div>`).join("")||`<p class="empty">—</p>`}
<h2>${t("lst")}</h2>${(a.data||[]).map(l=>`<div class="li"><a href="#/l/${l.id}">${esc(l.title)}<br><small>${fmt(l.price)} · ${esc(l.city)}${l.status==="hidden"?" · "+t("hid"):""}</small></a><button class="btn g sm" data-a="${l.status==="active"?"hide":"show"}" data-id="${l.id}">${l.status==="active"?t("hide"):t("show")}</button><button class="btn r sm" data-a="del" data-id="${l.id}">${t("del")}</button></div>`).join("")}`}

app.onclick=async e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,id=+b.dataset.id;
try{if(a==="out"){await sb.auth.signOut();me=null;favs=new Set();location.hash="#/";return route()}
if(!me)return(location.hash="#/auth",toast(t("need")));
if(a==="chat")return startChat(+b.dataset.listing,b.dataset.seller);
if(a==="fav"){if(favs.has(id)){await sb.from("favorites").delete().eq("listing_id",id);favs.delete(id)}else{const r=await sb.from("favorites").insert({listing_id:id});if(r.error)throw r.error;favs.add(id)}return route()}
if(a==="rep"){const w=prompt(t("why"));if(!w||w.trim().length<3)return;const r=await sb.from("reports").insert({listing_id:id,reason:w.trim().slice(0,500)});if(r.error)throw r.error;return toast(t("sent"))}
if(a==="del"){if(!confirm(t("sure")))return;const{data:l}=await sb.from("listings").select("images").eq("id",id).maybeSingle();const r=await sb.from("listings").delete().eq("id",id);if(r.error)throw r.error;if(l)await rmImgs(l.images);toast(t("ok"));if(location.hash.startsWith("#/l/"))location.hash="#/";else route();return}
if(a==="hide"||a==="show"){const r=await sb.rpc("admin_set_status",{lid:id,s:a==="hide"?"hidden":"active"});if(r.error)throw r.error;return route()}
if(a==="res"){const r=await sb.from("reports").update({resolved:true}).eq("id",id);if(r.error)throw r.error;return route()}}catch(x){fail(x)}};

async function route(){const h=location.hash.replace(/^#\/?/,"").split("/");if(h[0]!=="chat"&&activeChatChannel){sb.removeChannel(activeChatChannel);activeChatChannel=null;activeChatId=null}nav();window.scrollTo(0,0);
try{switch(h[0]){case"l":return await detail(+h[1]);case"favs":return await favsV();case"chats":return await chatsV();case"chat":return await chatV(h[1]);case"post":return await postV(h[1]?+h[1]:null);case"auth":return authV();case"me":return await meV();case"admin":return await adminV();default:return await home()}}catch(x){fail(x)}}
$("#lg").value=lang;$("#lg").onchange=e=>{lang=e.target.value;localStorage.lang=lang;document.documentElement.lang=lang;route()};
sb.auth.onAuthStateChange((ev)=>{if(ev==="SIGNED_OUT"){me=null;nav()}});window.addEventListener("hashchange",route);
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
refreshMe().catch(e=>fail(e)).finally(route);
</script>
